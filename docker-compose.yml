# Build Spring Boot images first:
#   sh scripts/build-images.sh
#
# Then run compose locally:
#   sh scripts/start-compose.sh

x-tracing-env: &tracing-env
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  LOGGING_PATTERN_LEVEL: "%5p [%X{traceId:-}, %X{spring.application.name:-}:%X{spring.application.instance_id:-}]"

x-postgres-env: &postgres-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-upload_service}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

services:
  service-registry:
    image: service-registry:0.0.1-SNAPSHOT
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      <<: *tracing-env
    depends_on:
      zipkin:
        condition: service_started

  # this should be run for local tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-upload_service}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  config-server:
    image: spring-cloud-config-server:0.0.1-SNAPSHOT
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      <<: *tracing-env
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_REPO_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_REPO_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_REPO_TOKEN}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_REPO_BRANCH:-main}
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started

  limits-service:
    image: limits-service:0.0.1-SNAPSHOT
    container_name: limits-service
    ports:
      - "8089:8089"
    environment:
      <<: *tracing-env
      SERVER_PORT: 8089
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  upload-service-1:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-1
    ports:
      - "8082:8082"
    environment:
      <<: [*tracing-env, *postgres-env]
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy

  upload-service-2:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-2
    environment:
      <<: [*tracing-env, *postgres-env]
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy

  upload-service-3:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-3
    environment:
      <<: [*tracing-env, *postgres-env]
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy

  upload-service-4:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-4
    environment:
      <<: [*tracing-env, *postgres-env]
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy

  api-gateway:
    image: api-gateway:0.0.1-SNAPSHOT
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      <<: *tracing-env
      SERVER_PORT: 8765
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      zipkin:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
      limits-service:
        condition: service_started
      upload-service-1:
        condition: service_started
      upload-service-2:
        condition: service_started
      upload-service-3:
        condition: service_started
      upload-service-4:
        condition: service_started

volumes:
  postgres-data:
