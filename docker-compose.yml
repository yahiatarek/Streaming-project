# to run compose locally: docker compose --env-file .env.prod up --build

services:
  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8761'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  config-server:
    build:
      context: ./spring-cloud-config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_REPO_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_REPO_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_REPO_TOKEN}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_REPO_BRANCH:-main}
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8888'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  limits-service:
    build:
      context: ./limits-service
    container_name: limits-service
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  upload-service-1:
    build:
      context: ./upload-service
    container_name: upload-service-1
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/upload-service-db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  upload-service-2:
    build:
      context: ./upload-service
    container_name: upload-service-2
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/upload-service-db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  upload-service-3:
    build:
      context: ./upload-service
    container_name: upload-service-3
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/upload-service-db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  upload-service-4:
    build:
      context: ./upload-service
    container_name: upload-service-4
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/upload-service-db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      SERVER_PORT: 8765
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      limits-service:
        condition: service_started
      upload-service-1:
        condition: service_started
      upload-service-2:
        condition: service_started
      upload-service-3:
        condition: service_started
      upload-service-4:
        condition: service_started
