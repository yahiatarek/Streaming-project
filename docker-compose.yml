# Build Spring Boot images first:
#   sh scripts/build-images.sh
#
# Then run compose locally:
#   sh scripts/start-compose.sh

services:
  service-registry:
    image: service-registry:0.0.1-SNAPSHOT
    container_name: service-registry
    ports:
      - "8761:8761"

  config-server:
    image: spring-cloud-config-server:0.0.1-SNAPSHOT
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_REPO_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_REPO_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_REPO_TOKEN}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_REPO_BRANCH:-main}
    depends_on:
      service-registry:
        condition: service_started

  limits-service:
    image: limits-service:0.0.1-SNAPSHOT
    container_name: limits-service
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  upload-service-1:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-1
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/tmp/upload-service-db
      # CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      # CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      # CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  upload-service-2:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-2
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/tmp/upload-service-db
      # CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      # CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      # CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  upload-service-3:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-3
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/tmp/upload-service-db
      # CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      # CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      # CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  upload-service-4:
    image: upload-service:0.0.1-SNAPSHOT
    container_name: upload-service-4
    environment:
      SERVER_PORT: 0
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/tmp/upload-service-db
      # CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      # CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      # CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

  api-gateway:
    image: api-gateway:0.0.1-SNAPSHOT
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      SERVER_PORT: 8765
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
      limits-service:
        condition: service_started
      upload-service-1:
        condition: service_started
      upload-service-2:
        condition: service_started
      upload-service-3:
        condition: service_started
      upload-service-4:
        condition: service_started
  # this should be run for local tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    restart: unless-stopped
